<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1419" />
    <meta name="description" content="Capture a page, extract the text, read it anywhere." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReadGlass" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>ReadGlass</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <button class="icon-btn" id="backBtn" hidden aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="brand" id="brandMark">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">ReadGlass</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Cycle reading theme" title="Theme">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <button class="icon-btn" id="installBtn" hidden aria-label="Install app" title="Install">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12M8 11l4 4 4-4M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </header>

      <main>
        <!-- Library -->
        <section class="view" id="libraryView">
          <div class="hero">
            <h1 class="hero-brand">ReadGlass</h1>
            <p class="hero-copy">Point it at a page. Keep the words.</p>
            <div class="hero-actions">
              <button class="btn btn-primary" id="newBookBtn">New book</button>
              <button class="btn btn-ghost" id="quickCaptureBtn">Quick capture</button>
            </div>
          </div>
          <div class="section-head">
            <h2>Your library</h2>
            <span class="muted" id="bookCount"></span>
          </div>
          <div class="book-grid" id="bookGrid"></div>
          <p class="empty" id="libraryEmpty" hidden>
            No books yet. Capture a page from your screen or camera to start.
          </p>
        </section>

        <!-- Capture -->
        <section class="view" id="captureView" hidden>
          <div class="section-head">
            <h2 id="captureTitle">Capture page</h2>
          </div>
          <div class="capture-targets">
            <button class="capture-card" id="screenCaptureBtn" type="button">
              <strong>Screen</strong>
              <span>Share a window or tab (desktop)</span>
            </button>
            <label class="capture-card" for="cameraInput">
              <strong>Camera</strong>
              <span>Snap the page on your phone</span>
              <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
            </label>
            <label class="capture-card" for="fileInput">
              <strong>Screenshot</strong>
              <span>Upload an image from your device</span>
              <input id="fileInput" type="file" accept="image/*" hidden />
            </label>
          </div>

          <div class="preview-wrap" id="previewWrap" hidden>
            <img id="previewImage" alt="Captured page preview" />
            <div class="ocr-progress" id="ocrProgress" hidden>
              <div class="ocr-bar"><span id="ocrBar"></span></div>
              <p id="ocrStatus">Reading text…</p>
            </div>
          </div>

          <div class="editor" id="textEditor" hidden>
            <label class="field-label" for="ocrText">Extracted text</label>
            <textarea id="ocrText" rows="12" spellcheck="true"></textarea>
            <div class="editor-actions">
              <button class="btn btn-ghost" id="recaptureBtn" type="button">Recapture</button>
              <button class="btn btn-primary" id="savePageBtn" type="button">Save page</button>
            </div>
          </div>
        </section>

        <!-- Book detail -->
        <section class="view" id="bookView" hidden>
          <div class="book-meta">
            <input class="title-input" id="bookTitleInput" maxlength="120" aria-label="Book title" />
            <p class="muted" id="pageCountLabel"></p>
          </div>
          <div class="page-list" id="pageList"></div>
          <div class="sticky-actions">
            <button class="btn btn-ghost" id="exportBtn" type="button">Export text</button>
            <button class="btn btn-primary" id="addPageBtn" type="button">Add page</button>
            <button class="btn btn-primary" id="readBookBtn" type="button">Read</button>
          </div>
        </section>

        <!-- Reader -->
        <section class="view reader-view" id="readerView" hidden>
          <article class="reader-surface" id="readerSurface">
            <p class="reader-progress" id="readerProgress"></p>
            <div class="reader-text" id="readerText"></div>
          </article>
          <div class="reader-controls">
            <button class="btn btn-ghost" id="prevPageBtn" type="button">Prev</button>
            <div class="font-controls">
              <button class="icon-btn" id="fontDownBtn" aria-label="Smaller text">A−</button>
              <button class="icon-btn" id="fontUpBtn" aria-label="Larger text">A+</button>
            </div>
            <button class="btn btn-ghost" id="nextPageBtn" type="button">Next</button>
          </div>
        </section>
      </main>
    </div>

    <dialog class="modal" id="newBookModal">
      <form method="dialog" id="newBookForm">
        <h2>New book</h2>
        <label class="field-label" for="newBookTitle">Title</label>
        <input id="newBookTitle" name="title" required maxlength="120" placeholder="e.g. The book I’m reading" />
        <div class="editor-actions">
          <button class="btn btn-ghost" value="cancel" type="submit">Cancel</button>
          <button class="btn btn-primary" value="create" type="submit">Create & capture</button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
