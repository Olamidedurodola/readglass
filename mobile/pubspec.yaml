name: readglass_mobile
description: Floating ReadGlass bubble for Android — listen to books over Chrome/Selar.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_overlay_window: ^0.5.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.5
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
